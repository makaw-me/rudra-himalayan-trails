<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Traditional Himalayan village homestay surrounded by mountains">
  <defs>
    <linearGradient id="sky-home" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF2F3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="800" height="500" fill="url(#sky-home)" />

  <!-- Mountain Backdrop -->
  <polygon points="100,500 280,180 460,500" fill="#64816B" opacity="0.3" />
  <polygon points="320,500 520,130 720,500" fill="#164653" opacity="0.25" />

  <!-- Village Terrain Hill -->
  <path d="M0,420 Q350,340 800,440 L800,500 L0,500 Z" fill="#EAF2F3" />

  <!-- Traditional Mountain Cottage / Homestay -->
  <!-- Cottage Main Body -->
  <rect x="310" y="270" width="180" height="150" rx="6" fill="#164653" />
  <!-- Slanted Slate Roof -->
  <polygon points="280,270 400,190 520,270" fill="#344B53" />
  <!-- Chimney -->
  <rect x="440" y="195" width="22" height="40" fill="#164653" />

  <!-- Wooden Balcony & Details -->
  <rect x="330" y="300" width="50" height="50" rx="3" fill="#FFFFFF" opacity="0.9" />
  <line x1="355" y1="300" x2="355" y2="350" stroke="#164653" stroke-width="3" />
  <line x1="330" y1="325" x2="380" y2="325" stroke="#164653" stroke-width="3" />

  <rect x="420" y="300" width="50" height="50" rx="3" fill="#FFFFFF" opacity="0.9" />
  <line x1="445" y1="300" x2="445" y2="350" stroke="#164653" stroke-width="3" />
  <line x1="420" y1="325" x2="470" y2="325" stroke="#164653" stroke-width="3" />

  <!-- Entrance Door -->
  <rect x="375" y="365" width="50" height="55" rx="3" fill="#FFBD3D" />

  <!-- Pine Trees near cottage -->
  <polygon points="210,430 235,350 260,430" fill="#64816B" />
  <polygon points="218,375 235,320 252,375" fill="#64816B" />

  <polygon points="560,440 585,360 610,440" fill="#64816B" />
  <polygon points="568,385 585,330 602,385" fill="#64816B" />

  <!-- Label badge -->
  <rect x="40" y="445" width="180" height="24" rx="4" fill="#164653" opacity="0.85" />
  <text x="50" y="461" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Village Homestays • Photo</text>
</svg>
