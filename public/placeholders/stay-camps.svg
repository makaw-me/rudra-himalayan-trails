<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Himalayan alpine camping site under mountain stars">
  <defs>
    <linearGradient id="sky-camps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#164653" />
      <stop offset="100%" stop-color="#344B53" />
    </linearGradient>
  </defs>
  <!-- Night sky background -->
  <rect width="800" height="500" fill="url(#sky-camps)" />

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="280" cy="60" r="2" fill="#FFBD3D" opacity="0.9" />
  <circle cx="450" cy="90" r="1.5" fill="#FFFFFF" opacity="0.7" />
  <circle cx="620" cy="70" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="710" cy="110" r="1.5" fill="#FFBD3D" opacity="0.8" />
  <circle cx="200" cy="130" r="1" fill="#FFFFFF" opacity="0.6" />
  <circle cx="530" cy="40" r="2" fill="#FFFFFF" opacity="0.9" />

  <!-- Moon / Celestial glow -->
  <circle cx="680" cy="80" r="32" fill="#FFBD3D" opacity="0.85" />

  <!-- High Mountain Silhouettes -->
  <polygon points="50,420 220,160 390,420" fill="#344B53" opacity="0.8" />
  <polygon points="260,420 480,120 700,420" fill="#164653" opacity="0.9" />
  <polygon points="520,440 660,200 800,440" fill="#344B53" opacity="0.7" />

  <!-- Valley Floor -->
  <path d="M0,400 Q400,380 800,410 L800,500 L0,500 Z" fill="#344B53" />

  <!-- Alpine Safari Tent 1 (Center) -->
  <polygon points="340,430 430,280 520,430" fill="#EAF2F3" />
  <polygon points="430,280 520,430 460,430" fill="#64816B" opacity="0.4" />
  <!-- Tent Entry Flap -->
  <polygon points="400,430 430,330 460,430" fill="#FFBD3D" opacity="0.9" />
  <line x1="430" y1="280" x2="430" y2="430" stroke="#164653" stroke-width="2" />

  <!-- Smaller Tent 2 (Left) -->
  <polygon points="180,440 240,340 300,440" fill="#EAF2F3" opacity="0.9" />
  <polygon points="220,440 240,370 260,440" fill="#FFBD3D" opacity="0.85" />

  <!-- Campfire glow -->
  <circle cx="560" cy="435" r="16" fill="#FFBD3D" opacity="0.3" />
  <polygon points="555,438 560,420 565,438" fill="#FFBD3D" />

  <!-- Label badge -->
  <rect x="40" y="445" width="160" height="24" rx="4" fill="#EAF2F3" opacity="0.9" />
  <text x="50" y="461" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#164653">Alpine Camps • Photo</text>
</svg>
